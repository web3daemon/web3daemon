<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 8" width="900" height="8" role="presentation">
  <defs>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF1F2E" stop-opacity="0.9"></stop>
      <stop offset="10%" stop-color="#FF1F2E" stop-opacity="0.35"></stop>
      <stop offset="40%" stop-color="#8A8A95" stop-opacity="0.3"></stop>
      <stop offset="100%" stop-color="#8A8A95" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF3B45" stop-opacity="0"></stop>
      <stop offset="50%" stop-color="#FF6B72" stop-opacity="0.9"></stop>
      <stop offset="100%" stop-color="#FF3B45" stop-opacity="0"></stop>
    </linearGradient>
  </defs>
  <style>
    @keyframes glide { 0% { transform: translateX(0) } 60%, 100% { transform: translateX(740px) } }
    .glide { animation: glide 5.5s cubic-bezier(.5,0,.5,1) infinite; }
    @media (prefers-reduced-motion: reduce) { .glide { animation: none; opacity: 0 } }
  </style>
  <rect y="3.5" width="900" height="1" fill="url(#r)"></rect>
  <rect class="glide" y="3" width="160" height="2" fill="url(#s)" opacity="0.7"></rect>
</svg>