<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 44" width="900" height="44" role="img" aria-label="Open to work — contract or full-time">
  <title>Open to work — contract or full-time</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0C0C10"></stop><stop offset="100%" stop-color="#08080A"></stop>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF1F2E" stop-opacity="0.18"></stop>
      <stop offset="40%" stop-color="#FF1F2E" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="fadeMask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"></stop>
      <stop offset="6%" stop-color="#FFFFFF"></stop>
      <stop offset="88%" stop-color="#FFFFFF"></stop>
      <stop offset="100%" stop-color="#000000"></stop>
    </linearGradient>
    <mask id="tickerMask"><rect x="252" y="0" width="648" height="44" fill="url(#fadeMask)"></rect></mask>
    <clipPath id="c"><rect width="900" height="44" rx="10"></rect></clipPath>
  </defs>
  <style>
    /* the stack list is present twice; one loop shifts by exactly one
       repetition — half the measured 3726px run — so the seam never shows */
    @keyframes ticker { from { transform: translateX(0) } to { transform: translateX(-1863px) } }
    @keyframes pulse  { 0%, 100% { opacity: .45 } 50% { opacity: 1 } }
    .ticker { animation: ticker 36s linear infinite; }
    .live   { animation: pulse 2.4s ease-in-out infinite; }
  </style>
  <rect width="900" height="44" rx="10" fill="url(#bg)"></rect>
  <g clip-path="url(#c)"><rect width="900" height="44" fill="url(#glow)"></rect><rect width="3" height="44" fill="#FF1F2E" opacity="0.8"></rect></g>
  <rect x="0.5" y="0.5" width="899" height="43" rx="10" fill="none" stroke="#22222A"></rect>

  <circle class="live" cx="26" cy="22" r="4" fill="#FF1F2E"></circle>
  <text x="42" y="27" font-family="ui-monospace,&#39;SF Mono&#39;,SFMono-Regular,Menlo,Consolas,&#39;Liberation Mono&#39;,&#39;DejaVu Sans Mono&#39;,monospace" font-size="12" font-weight="700" letter-spacing="2.6" fill="#F4F1EC">OPEN TO WORK</text>
  <rect x="188" y="12" width="1" height="20" fill="#2E2E37"></rect>
  <text x="204" y="27" font-family="ui-monospace,&#39;SF Mono&#39;,SFMono-Regular,Menlo,Consolas,&#39;Liberation Mono&#39;,&#39;DejaVu Sans Mono&#39;,monospace" font-size="12" letter-spacing="2" fill="#5E5E68">STACK</text>

  <g mask="url(#tickerMask)">
    <g class="ticker">
      <text x="262" y="27" font-family="ui-monospace,&#39;SF Mono&#39;,SFMono-Regular,Menlo,Consolas,&#39;Liberation Mono&#39;,&#39;DejaVu Sans Mono&#39;,monospace" font-size="12" letter-spacing="0.5" fill="#8A8A95">FastAPI   ·   asyncio   ·   Pydantic   ·   WebSocket   ·   FastStream   ·   aiogram 3   ·   PostgreSQL   ·   TimescaleDB   ·   SQLAlchemy   ·   Redis   ·   OpenAI   ·   Claude   ·   Grok   ·   OpenRouter   ·   RAG   ·   LangChain   ·   MCP   ·   n8n   ·   TypeScript   ·   React   ·   Next.js   ·   Docker   ·   Linux   ·   Nginx   ·   AWS   ·   GitHub Actions   ·   FastAPI   ·   asyncio   ·   Pydantic   ·   WebSocket   ·   FastStream   ·   aiogram 3   ·   PostgreSQL   ·   TimescaleDB   ·   SQLAlchemy   ·   Redis   ·   OpenAI   ·   Claude   ·   Grok   ·   OpenRouter   ·   RAG   ·   LangChain   ·   MCP   ·   n8n   ·   TypeScript   ·   React   ·   Next.js   ·   Docker   ·   Linux   ·   Nginx   ·   AWS   ·   GitHub Actions   ·   </text>
    </g>
  </g>
</svg>