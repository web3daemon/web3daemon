      <stop offset="70%" stop-color="#FF1F2E" stop-opacity="0.18"></stop>
      <stop offset="100%" stop-color="#FF6B72" stop-opacity="0.55"></stop>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05"></stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0 L0 0 0 36" fill="none" stroke="#FFFFFF" stroke-opacity="0.028" stroke-width="1"></path>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
